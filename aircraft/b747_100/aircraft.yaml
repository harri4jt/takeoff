# =====================================================================================
#  Boeing 747-100 (JT9D-3) - real-aircraft data, digitized from public sources.
#  Every value is cited in README.md. Tables are built by tools/make_b747_tables.py.
#  Valid for SEA LEVEL, STANDARD DAY only (the thrust table is not rescaled for
#  altitude or temperature).
# =====================================================================================
name: Boeing 747-100
synthetic: false
description: >-
  Boeing 747-100 with JT9D-3 engines. Aero from NASA CR-114494 (Boeing simulator data),
  thrust at AFM takeoff EPR, sea level standard day.

geometry:
  span_ft: 195.7                # 195 ft 8 in, Boeing D6-58326 sec. 2
  wing_area_ft2: 5500.0         # CR-114494 p.1.1-3, "Summary of areas and dimensions"

weight:
  default_weight_lbf: 710000.0  # 747-100 maximum takeoff weight, Boeing D6-58326 sec.3.3.1

engines:
  n_engines: 4
  thrust_mode: table
  thrust_tables:
    JT9D-3: thrust.csv          # per engine vs TAS, EPR 1.42, SL ISA (see README)
  thrust_table: JT9D-3          # default thrust table
  idle_thrust_per_engine_lbf: 2000.0   # ESTIMATE (not from a source), see README
  thrust_incidence_deg: 0.0     # not given; thrust line taken along the body axis
  tsfc_per_hr: 0.36             # ESTIMATE: JT9D-3 class takeoff TSFC (fuel burn ~0.1% of TOGW)

attitude:
  # Attitudes are in the wing-reference-plane frame the aero tables use:
  # alpha_WRP = alpha_FRL + 2 deg (CR-114494 p.1.3-4).
  theta_ground_deg: 2.0         # fuselage level on the ground (FRL 0 deg) -> WRP 2 deg
  theta_tailstrike_deg: 15.0    # ~13 deg fuselage attitude, from the D6-58326 side view

aero:
  configurations:
    flaps10: aero_flaps10.csv
    flaps20: aero_flaps20.csv
  takeoff_configuration: flaps20  # Boeing's chart uses flaps 20 except at the heaviest weights
  delta_CD_engine_out: 0.0015   # windmilling drag, CR-114494 p.12.4-2 (~600 lb at M 0.22)
  CLmax:                        # from certification stall speeds, CR-114494 p.2.0-37
    flaps10: 1.95
    flaps20: 2.13

spoilers:                       # ESTIMATE (not from a source), see README
  delta_CL: -0.60
  delta_CD: 0.070

chute:
  enabled: false                # transports do not use drag chutes

speeds:
  V_mcg_kts: 106.0              # AFM minimum control speeds, CR-114494 p.15.0-23 (SL, 15 C)

ground_effect:                  # Raymer method; on in the baseline (validation: docs/assumptions/ground_effect.md)
  enabled: true
  span_ft: 195.7                # 195 ft 8 in, Boeing D6-58326 sec. 2
  wing_height_ft: 16.0          # ESTIMATE: quarter-chord MAC height on the gear

certification:
  rules: part25                 # civil transport: FAA Part 25 balanced field length
  # t_recog_s: 1.0              # engine failure -> V1 delay; blank = rule default (1 s)

landing:
  weight_lbf: 564000.0          # 747-100 maximum landing weight (commonly published value;
                                # confirm against the Boeing airport-planning document)
  configuration: flaps20        # no flaps 25/30 table yet: start from flaps 20 ...
  k_CL: 1.12                    # ... ESTIMATE: landing flaps add ~12 % CL / CLmax
  k_CD: 1.30                    # ... ESTIMATE: and ~30 % drag
  # approach_speed_ratio:       # blank = rule (Part 25: V_REF = 1.23 V_SR0)
  approach_angle_deg: 3.0
  flare_load_factor: 1.15       # constant-g flare
  free_roll_s: 2.0              # touchdown -> brakes and spoilers
  reverse_thrust_fraction: 0.0  # Part 25.125: no reverse-thrust credit
