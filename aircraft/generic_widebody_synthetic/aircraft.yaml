# =====================================================================================
#  SYNTHETIC AIRCRAFT - fictional 4-engine widebody. NOT data for any real airplane.
#  Order-of-magnitude values chosen so the solver produces big-jet-like numbers.
#  Tables generated by tools/make_synthetic_widebody.py. See README.md.
# =====================================================================================
name: Generic Widebody (synthetic)
synthetic: true
description: Fictional 4-engine widebody with invented, plausible-magnitude data.

geometry:
  wing_area_ft2: 5500.0

weight:
  default_weight_lbf: 775000.0

engines:
  n_engines: 4
  thrust_mode: table            # 'constant' or 'table'
  thrust_table: thrust.csv      # per-engine thrust vs airspeed
  thrust_per_engine_lbf: 50000.0  # used only if thrust_mode = constant
  idle_thrust_per_engine_lbf: 1500.0
  thrust_incidence_deg: 0.0

attitude:
  theta_ground_deg: 0.0
  theta_tailstrike_deg: 12.5

aero:
  configurations:
    takeoff: aero_takeoff.csv
  takeoff_configuration: takeoff
  delta_CD_engine_out: 0.0040   # lumped windmill + trim drag after failure (synthetic)

spoilers:
  delta_CL: -0.60
  delta_CD: 0.070

chute:                          # synthetic demo chute; NOT creditable under Part 25
  enabled: false
  area_ft2: 1500.0
  CD: 0.60
  deploy_delay_s: 1.0
  inflation_time_s: 1.0

speeds:
  V_mcg_kts: null               # none given -> V1_min = 0.6 VR
