# =====================================================================================
#  Lockheed SR-71A (2x Pratt & Whitney J58) - real-aircraft data from the declassified
#  flight manual SR-71A-1. Every value is cited in README.md; tables are built by
#  tools/make_sr71_tables.py. Drag is an ESTIMATE (the manual has no low-speed polar).
#  The thrust table is for sea-level pressure altitude, -38..40 C.
#  The SR-71 is a military aircraft: Part 25 rules are applied here only for comparison.
# =====================================================================================
name: Lockheed SR-71A
synthetic: false
description: >-
  Lockheed SR-71A with J58 engines in maximum afterburner. Lift and thrust from the
  declassified flight manual; drag estimated. Drag chute available.

geometry:
  wing_area_ft2: 1605.0         # SR-71A-1 Section I, "Dimensions" (reference wing area)

weight:
  default_weight_lbf: 140000.0  # SR-71A-1 Section I: loaded gross weight 135,000 to over 140,000 lb

engines:
  n_engines: 2
  thrust_mode: table
  thrust_table: thrust.csv      # per engine vs TAS and OAT, max A/B, SL (Fig. 1-3)
  idle_thrust_per_engine_lbf: 500.0    # Fig. 1-5: ~1,250 lb static falling to ~0 at 170 KIAS; mean over a stop
  thrust_incidence_deg: 0.0     # not given

attitude:
  # The table alpha is body pitch attitude (= indicated alpha + 1.2 deg, see README).
  theta_ground_deg: 0.0         # SR-71A-1 Section I (attitude indicator): 0 deg pitch on the ground
  theta_tailstrike_deg: 11.0    # NOT a geometric limit: set so the held attitude (limit - 1 deg)
                                # is the manual's normal takeoff attitude of 10 deg (Section II)

aero:
  configurations:
    ground_effect: aero_ground_effect.csv
    free_air: aero_free_air.csv
  takeoff_configuration: ground_effect   # whole run to 35 ft is within ~0.6 span of the ground
  delta_CD_engine_out: 0.010    # ESTIMATE: windmilling J58 + rudder/sideslip trim (see README)
  CLmax:                        # no stall: free-air CL at the 18 deg pitch-up angle of attack
    ground_effect: 0.92         # (SR-71A-1 Section VI) stands in for CLmax when setting V_S
    free_air: 0.92

spoilers:                       # the SR-71 has no spoilers
  delta_CL: 0.0
  delta_CD: 0.0

chute:
  enabled: true                 # standard SR-71 abort procedure (no Part 25 credit; flagged)
  area_ft2: 1256.6              # 40 ft ribbon chute (SR-71A-1 Section I): pi * 20^2
  CD: 0.50                      # typical ribbon-chute CD on nominal area (ESTIMATE)
  deploy_delay_s: 1.0
  inflation_time_s: 1.0
